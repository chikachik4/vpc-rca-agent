[project]
name = "vpc-rca-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=0.1.0",
    "boto3>=1.42",
    "httpx>=0.28",
    "mcp>=1.0",
    "redis>=7.4",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
